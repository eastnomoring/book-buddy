name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ============ 后端测试 ============
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 与本地 backend/pyproject.toml 配套的 ruff 版本保持一致，避免规则漂移
          pip install ruff==0.16.1

      - name: Ruff check
        run: ruff check .

      - name: Run pytest
        env:
          # 测试用 dependency_overrides 注入 fake LLM，不需要真实 key；
          # 给个占位值避免配置校验报错
          DASHSCOPE_API_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
        run: python -m pytest tests/ -q

  # ============ 前端共享层 + 构建 ============
  frontend:
    name: Frontend (core test + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm 须在 setup-node(cache: pnpm) 之前安装
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # pnpm@11.18 需要 Node >= 22.13（node:sqlite）
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Build core
        run: pnpm --filter @book-buddy/core build

      - name: Run core tests
        run: pnpm --filter @book-buddy/core test

      - name: Type-check web + build
        run: pnpm --filter @book-buddy/web build

      # uni build 不做类型检查，type-check 须单独设卡，防止类型错误被构建掩盖
      - name: Type-check mp
        run: pnpm --filter @book-buddy/mp run type-check

      - name: Build mp-weixin
        run: pnpm --filter @book-buddy/mp build:mp-weixin
