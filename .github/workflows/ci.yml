name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ============ 后端测试 ============
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          # 测试用 dependency_overrides 注入 fake LLM，不需要真实 key；
          # 给个占位值避免配置校验报错
          DASHSCOPE_API_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
        run: python -m pytest tests/ -q

  # ============ 前端共享层 + 构建 ============
  frontend:
    name: Frontend (core test + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @book-buddy/core build

      - name: Run core tests
        run: pnpm --filter @book-buddy/core test

      - name: Build web
        run: pnpm --filter @book-buddy/web build

      - name: Build mp-weixin
        run: pnpm --filter @book-buddy/mp build:mp-weixin
