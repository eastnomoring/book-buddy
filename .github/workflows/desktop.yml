name: Desktop Build

# 桌面端三平台打包（macOS / Windows / Linux）。
# 仓库 push 到 GitHub 后生效。产物作为 artifact 上传。
#
# 产物路径（tauri bundle）：
#   macOS:   *.dmg / *.app
#   Windows: *.msi / *.exe (nsis)
#   Linux:   *.deb / *.AppImage / *.rpm

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest 现为 Apple Silicon；双 --target 不被当前 CLI 接受
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # frontendDist 指向 apps/web/dist，打包前必须先产出静态资源
      - name: Build core + web
        run: |
          pnpm --filter @book-buddy/core build
          pnpm --filter @book-buddy/web build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Book Buddy ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload desktop artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: book-buddy-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg
            apps/desktop/src-tauri/target/release/bundle/macos
            apps/desktop/src-tauri/target/release/bundle/msi
            apps/desktop/src-tauri/target/release/bundle/nsis
            apps/desktop/src-tauri/target/release/bundle/deb
            apps/desktop/src-tauri/target/release/bundle/appimage
            apps/desktop/src-tauri/target/release/bundle/rpm
          if-no-files-found: warn
          retention-days: 14
