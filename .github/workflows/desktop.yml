name: Desktop Build

# 桌面端三平台打包（macOS / Windows / Linux）。
# 仓库 push 到 GitHub 后生效。产物作为 artifact 上传。
#
# 产物路径（tauri-action 默认）：
#   macOS:   *.dmg / *.app
#   Windows: *.msi / *.exe (nsis)
#   Linux:   *.deb / *.AppImage / *.rpm

on:
  push:
    branches: [master, main]
    tags: ["v*"]  # 打 tag 时触发发布构建
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # 手动触发

jobs:
  build-tauri:
    strategy:
      fail-fast: false  # 一个平台失败不影响其他
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 双架构
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (dependency of web)
        run: pnpm --filter @book-buddy/core build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # tag 触发时上传到 Release，否则只构建
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Book Buddy ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
