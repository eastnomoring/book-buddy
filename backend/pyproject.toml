[tool.ruff]
target-version = "py312"
# 与现有代码风格匹配：当前最宽行 134 字符
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入惯用法：这些调用作为参数默认值是有意为之
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Path",
]

[tool.ruff.lint.per-file-ignores]
# main.py 有意先 load_dotenv 再 import 应用模块
"main.py" = ["E402"]
